# Tests run against PostgreSQL with the real Flyway migrations (CI provides these variables).
spring.datasource.url=${POSTGRES_TEST_URL:jdbc:postgresql://localhost:5432/b26_test}
spring.datasource.username=${POSTGRES_TEST_USER:postgres}
spring.datasource.password=${POSTGRES_TEST_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
# Each test context and test class starts from a clean, freshly migrated schema plus test fixtures.
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/test-fixtures
