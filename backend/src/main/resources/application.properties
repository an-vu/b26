spring.application.name=b26-backend

spring.profiles.default=postgres
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Render and Vercel proxy API calls; honor X-Forwarded-* so getRemoteAddr() is the client address.
server.forward-headers-strategy=framework

# CORS origins can be a comma-separated list, e.g.
# APP_CORS_ALLOWED_ORIGINS=https://mytechportfolio.com,https://www.mytechportfolio.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Temporary mode for local UX iteration:
# true  -> email + password signin
# false -> local-only email signin; startup rejects this under prod or on Render
app.auth.require-password=${APP_AUTH_REQUIRE_PASSWORD:true}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Opt-in local demo accounts; the seeder is excluded from the prod profile.
app.demo-users.enabled=${APP_DEMO_USERS_ENABLED:false}

# Server-only Instagram provider; unset keeps Social widgets in link-only mode.
app.instagram.apify-token=${APIFY_TOKEN:}
app.instagram.daily-fetch-limit=${INSTAGRAM_DAILY_FETCH_LIMIT:20}
