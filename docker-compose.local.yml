# Self-contained local development with frontend live reload. Never use this password bypass for deployment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: b26
      POSTGRES_USER: b26
      POSTGRES_PASSWORD: b26-local-only
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b26 -d b26"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/b26
      SPRING_DATASOURCE_USERNAME: b26
      SPRING_DATASOURCE_PASSWORD: b26-local-only
      APP_AUTH_REQUIRE_PASSWORD: "false"
      APP_DEMO_USERS_ENABLED: "true"
      APP_ADMIN_TOKEN: ""
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: development
    init: true
    environment:
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  local-postgres:
