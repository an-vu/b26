@if (brandAtTop()) {
  <header class="home-header" aria-label="BlueBerry">
    @if (blur.enabled()) {
      <div class="header-blur" aria-hidden="true"><span class="blur-layer"></span></div>
    }
    <div class="header-inner">
      <button class="toolbar-wordmark home-header-brand" type="button" aria-label="About BlueBerry" aria-haspopup="dialog" (click)="closeAccount(); aboutPanel.open($event)">BlueBerry</button>
    </div>
  </header>
}
@if (blur.enabled()) {
  <div class="footer-blur" aria-hidden="true"><span class="blur-layer"></span></div>
}
<nav class="bottom-actions" [class.has-top-brand]="brandAtTop()" aria-label="Main navigation">
      <div class="bottom-actions-left">
        <button type="button" aria-label="Home" class="bottom-action-button orb-button navigation-orb" routerLink="/">
          <span class="orb-button__dot" aria-hidden="true"><app-icon name="home" [strokeWidth]="2.2" svgClass="navigation-orb__icon" /></span>
        </button>
        <button type="button" aria-label="Search" class="bottom-action-button orb-button navigation-orb" (click)="closeAccount(); userSearch.open($event)" aria-haspopup="dialog">
          <span class="orb-button__dot" aria-hidden="true"><app-icon name="search" [strokeWidth]="2.2" svgClass="navigation-orb__icon" /></span>
        </button>
        <div class="account-menu-wrap" appPanelBehavior [panelOpen]="accountOpen()" [panelInternalView]="accountSettingsOpen()" (panelDismiss)="dismissAccount($event)">
          <button type="button" aria-label="Account" class="bottom-action-button orb-button navigation-orb" (click)="toggleAccount()" [attr.aria-expanded]="accountOpen()">
            <span class="orb-button__dot" aria-hidden="true"><app-icon name="account" [strokeWidth]="2.2" svgClass="navigation-orb__icon" /></span>
          </button>
          <div class="account-menu account-panel utility-panel toolbar-panel toolbar-panel--left" role="region" aria-label="Account" *ngIf="accountOpen()">
            <ng-container *ngIf="user$ | async as user; else signedOutMenu">
            <h2 class="board-settings-heading account-heading">@{{ user.username }}</h2>
            <section class="account-notifications panel-content-centered" aria-label="Notifications">
              @if (accountSettingsOpen()) {
                <div class="account-settings-list panel-content-group" aria-label="Account settings">
                  <button type="button" class="app-button" routerLink="/settings" (click)="closeAccount()">Settings</button>
                  <button type="button" class="app-button settings-delete app-button--danger" (click)="signOut()" [disabled]="signingOut()">{{ signingOut() ? 'Signing out…' : 'Sign Out' }}</button>
                </div>
              } @else {
                <div class="panel-content-group"><p>No new notifications</p></div>
              }
            </section>
            <hr />
            <div class="board-settings-tools account-tools panel-actions">
              <button type="button" class="app-button nav-icon-button app-button--icon" aria-label="Insights" routerLink="/insights" (click)="closeAccount()">
                <app-icon name="insights" [strokeWidth]="1.7" />
              </button>
              <button type="button" class="app-button my-board-button panel-action-main" [routerLink]="['/', user.username]" (click)="closeAccount()">My Board</button>
              <button type="button" class="app-button nav-icon-button app-button--icon" aria-label="Settings" [attr.aria-expanded]="accountSettingsOpen()" (click)="toggleAccountSettings()">
                <app-icon name="settings" [strokeWidth]="1.7" />
              </button>
            </div>
            <p class="account-menu-error" role="alert" *ngIf="error()">{{ error() }}</p>
            </ng-container>
            <ng-template #signedOutMenu>
              <a class="account-link" routerLink="/signin" (click)="closeAccount()">Sign In</a>
            </ng-template>
          </div>
        </div>
      </div>
  <div class="navigation-context"><ng-content /></div>
  @if (!brandAtTop()) {
    <button class="toolbar-wordmark" type="button" aria-label="About BlueBerry" aria-haspopup="dialog" (click)="closeAccount(); aboutPanel.open($event)">BlueBerry</button>
  }
</nav>
<app-user-search #userSearch [attr.data-theme]="theme.themeId()" [attr.data-color-mode]="theme.colorMode()" />
<app-about-panel #aboutPanel [attr.data-theme]="theme.themeId()" [attr.data-color-mode]="theme.colorMode()" />
