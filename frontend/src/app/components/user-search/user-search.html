<dialog class="utility-panel" #dialog aria-label="Search users" (cancel)="close()"
  (keydown.escape)="$event.preventDefault(); $event.stopPropagation(); close()">
  <ul *ngIf="state.status === 'ready' && state.results.length" aria-label="Search results">
    <li *ngFor="let user of state.results">
      <a [routerLink]="['/', user.username]" (click)="close(false)">
        <span class="search-user"><strong>{{ user.displayName }}</strong><span>@{{ user.username }}</span></span>
        <span class="search-likes"><strong>0</strong><span>Likes</span></span>
      </a>
    </li>
  </ul>
  <div id="user-search-status" role="status" aria-live="polite">
    <p *ngIf="state.status === 'too-long'">Use at most 64 username characters.</p>
    <p *ngIf="state.status === 'loading'">Searching…</p>
    <p *ngIf="state.status === 'ready' && !state.results.length">No users found.</p>
    <p *ngIf="state.status === 'error'">Search is unavailable. <button class="app-button" type="button" (click)="retry()">Try again</button></p>
  </div>
  <input id="user-search-input" type="search" autofocus autocomplete="off" spellcheck="false"
    aria-label="Search by username" placeholder="@username" maxlength="65" [value]="query"
    (input)="setQuery($any($event.target).value)" aria-describedby="user-search-status" />
</dialog>
