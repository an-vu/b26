<article class="widget">
  <h3>{{ widget?.title || 'Create Your Account' }}</h3>

  <form class="auth-form" (ngSubmit)="onSignupSubmit()">
    <label class="auth-field">
      <span>Email</span>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        autocomplete="email"
        [disabled]="isSubmitting"
        required
      />
    </label>

    <label class="auth-field">
      <span>Password</span>
      <input
        type="password"
        name="password"
        minlength="8"
        maxlength="72"
        [(ngModel)]="password"
        placeholder="Create a password"
        autocomplete="new-password"
        [disabled]="isSubmitting"
        required
      />
    </label>

    <label class="auth-field">
      <span>Confirm Password</span>
      <input
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="Re-enter password"
        autocomplete="new-password"
        [disabled]="isSubmitting"
        required
      />
    </label>

    <button class="app-button" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating Account...' : 'Create Account' }}
    </button>
    <button class="app-button" type="button" [disabled]="isSubmitting" (click)="gotoSignin()">
      Already Have an Account?
    </button>

    <p class="auth-message auth-message--error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</article>
