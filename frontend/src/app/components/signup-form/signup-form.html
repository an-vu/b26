<article class="widget">
  <h3>{{ widget?.title || 'Create Your Account' }}</h3>

  <form class="auth-form" (ngSubmit)="onSignupSubmit()">
    <label class="auth-field">

      <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Email</span><input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email" aria-label="Email"
        autocomplete="email"
        [disabled]="isSubmitting"
        required
      /></span>
    </label>

    <label class="auth-field">

      <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Password</span><input
        type="password"
        name="password"
        minlength="8"
        maxlength="72"
        [(ngModel)]="password"
        placeholder="Password" aria-label="Password"
        autocomplete="new-password"
        [disabled]="isSubmitting"
        required
      /></span>
    </label>

    <label class="auth-field">

      <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Confirm Password</span><input
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="Confirm Password" aria-label="Confirm Password"
        autocomplete="new-password"
        [disabled]="isSubmitting"
        required
      /></span>
    </label>

    <button class="app-button" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating Account...' : 'Create Account' }}
    </button>
    <button class="app-button" type="button" [disabled]="isSubmitting" (click)="gotoSignin()">
      Already Have an Account?
    </button>

    <p class="auth-message auth-message--error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</article>
