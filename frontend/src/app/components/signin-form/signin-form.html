@if (showSignup) {
<app-signup-form
  (signinRequested)="showSignup = false"
></app-signup-form>
} @else {
  <article class="widget">
    <h3>{{ widget()?.title || 'Welcome Back!' }}</h3>

    <form class="auth-form" (ngSubmit)="onSigninSubmit()">
      <label class="auth-field">

        <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Email</span><input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Email" aria-label="Email"
          autocomplete="email"
          [disabled]="isSubmitting"
          required
        /></span>
      </label>

      <label class="auth-field">

        <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Password</span><input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Password" aria-label="Password"
          autocomplete="current-password"
          [disabled]="isSubmitting"
          required
        /></span>
      </label>

      <button class="app-button" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
      </button>
      <button class="app-button" type="button" [disabled]="isSubmitting" (click)="onSignupClick()">
        Don't Have an Account?
      </button>

      @if (errorMessage) {
        <p class="auth-message auth-message--error">{{ errorMessage }}</p>
      }
    </form>
  </article>
}
