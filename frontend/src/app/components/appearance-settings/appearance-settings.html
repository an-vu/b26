            <fieldset class="board-theme-picker">
              <legend>Theme · {{ pickerLabel('theme', selectedTheme.label) }}</legend>
              <div class="board-theme-options" [style.--theme-count]="themes.length">
                <button class="board-theme-option" type="button" *ngFor="let theme of themes"
                  [disabled]="disabled()" [attr.aria-label]="theme.label"
                  [attr.aria-pressed]="selectedTheme.id === theme.id" [attr.data-theme-option]="theme.id" (mouseenter)="pickerHover['theme'] = theme.label" (mouseleave)="pickerHover['theme'] = null"
                  (focus)="pickerFocus['theme'] = theme.label" (blur)="pickerFocus['theme'] = null"
                  (click)="set('themeFamily', theme.id)">
                  <span class="theme-swatch" [attr.data-family]="theme.id" aria-hidden="true"></span>

                </button>
              </div>
            </fieldset>
            <hr />
            <div class="board-appearance-row">
              <label>
                Widget Radius
                <input [disabled]="disabled()" type="range" name="board-radius" [style.--radius-fill]="(appearance().radiusStep - 1) * 50 + '%'" [attr.aria-valuetext]="sizeLabel(appearance().radiusStep)" min="1" max="3" step="1" [ngModel]="appearance().radiusStep" (ngModelChange)="set('radiusStep', $event)" />
              </label>
              <label>
                Widget Space
                <input [disabled]="disabled()" type="range" name="board-spacing" aria-label="Widget space" min="1" max="3" step="1" [style.--radius-fill]="((appearance().spacingStep ?? 2) - 1) * 50 + '%'" [attr.aria-valuetext]="sizeLabel(appearance().spacingStep ?? 2)" [ngModel]="appearance().spacingStep ?? 2" (ngModelChange)="set('spacingStep', $event)" />
              </label>
            </div>
            <hr />
            <fieldset>
              <legend>Background Color · {{ pickerLabel('color', colorLabel) }}</legend>
              <div class="board-color-options">
                <button *ngFor="let color of colors" type="button"
                  [title]="color.name" [attr.aria-label]="color.name + ' background'" [attr.aria-pressed]="appearance().backgroundColor === color.value"
                  [style.background]="color.value" (mouseenter)="pickerHover['color'] = color.name" (mouseleave)="pickerHover['color'] = null"
                  (focus)="pickerFocus['color'] = color.name" (blur)="pickerFocus['color'] = null" [disabled]="disabled()"
                  (click)="set('backgroundColor', color.value)"></button>
              </div>
            </fieldset>
            <fieldset>
              <legend>Pattern · {{ pickerLabel('pattern', patternLabel(appearance().pattern)) }}</legend>
              <div class="board-pattern-options">
                <button *ngFor="let pattern of patterns" type="button"
                  [attr.data-pattern-option]="pattern" (mouseenter)="pickerHover['pattern'] = patternLabel(pattern)" (mouseleave)="pickerHover['pattern'] = null"
                  (focus)="pickerFocus['pattern'] = patternLabel(pattern)" (blur)="pickerFocus['pattern'] = null" [title]="patternLabel(pattern)" [attr.aria-label]="(pattern === 'grid' ? 'Meteor' : pattern) + ' pattern'" [attr.aria-pressed]="appearance().pattern === pattern"
                  [disabled]="disabled()" (click)="selectPattern(pattern)">
                  <app-icon *ngIf="pattern !== 'none'" [name]="pattern" />
                </button>
                <button *ngFor="let pattern of placeholderPatterns" type="button" class="pattern-placeholder"
                  [attr.data-pattern-option]="pattern" [attr.aria-label]="patternLabel(pattern) + ' pattern, coming soon'"
                  aria-disabled="true" aria-pressed="false" [disabled]="disabled()" [title]="patternLabel(pattern) + ' · Coming soon'"
                  (mouseenter)="pickerHover['pattern'] = patternLabel(pattern)" (mouseleave)="pickerHover['pattern'] = null"
                  (focus)="pickerFocus['pattern'] = patternLabel(pattern)" (blur)="pickerFocus['pattern'] = null">
                  <app-icon [name]="pattern" />
                </button>
              </div>
            </fieldset>
            <hr />
            <div class="board-appearance-row board-light-row">
              <label class="light-switch-label">
                <span>Light</span>
                <span class="light-switch-control">
                  <input [disabled]="disabled()" type="checkbox" role="switch" name="appearance-light-switch"
                    [ngModel]="appearance().theme !== 'dark'" (ngModelChange)="set('theme', $event ? 'light' : 'dark')" />
                  <span class="light-switch-track" aria-hidden="true"></span>
                </span>
              </label>
              <label class="light-switch-label">
                <span>Blur</span>
                <span class="light-switch-control">
                  <input type="checkbox" role="switch" name="chrome-blur-switch"
                    [ngModel]="blur.enabled()" (ngModelChange)="blur.setEnabled($event)" />
                  <span class="light-switch-track" aria-hidden="true"></span>
                </span>
              </label>
            </div>
            <hr />
<div *ngIf="showReset()" class="board-settings-tools"><button type="button" class="app-button settings-reset" [disabled]="disabled()" (click)="reset()">Reset to default</button></div>
