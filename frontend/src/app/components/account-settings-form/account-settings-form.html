<article class="widget">
  <h3>{{ widget()?.title || 'Account Settings' }}</h3>

  @if (vm(); as vm) {
    @if (vm.profile) {
    <section class="settings-section">
      <p class="settings-section-title">Account Information</p>

      <label class="settings-field">

        <div class="settings-input-status-row">
          <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Name</span><input
            type="text"
            [ngModel]="vm.displayName"
            (ngModelChange)="onProfileFieldChanged('displayName', $event)"
            placeholder="Name" aria-label="Name"
          /></span>
          @if (vm.profileSavedField === 'displayName') {
            <em class="settings-saved-indicator">Saved</em>
          }
        </div>
      </label>

      <label class="settings-field">

        <div class="settings-input-status-row">
          <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Username</span><input
            type="text"
            [ngModel]="vm.username"
            (ngModelChange)="onProfileFieldChanged('username', $event)"
            placeholder="Username" aria-label="Username"
          /></span>
          @if (vm.profileSavedField === 'username') {
            <em class="settings-saved-indicator">Saved</em>
          }
        </div>
      </label>

      <label class="settings-field">

        <div class="settings-input-status-row">
          <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Email</span><input
            type="email" required
            [ngModel]="vm.email"
            (ngModelChange)="onProfileFieldChanged('email', $event)"
            placeholder="Email" aria-label="Email"
          /></span>
          @if (vm.profileSavedField === 'email') {
            <em class="settings-saved-indicator">Saved</em>
          }
        </div>
      </label>

      <div class="settings-actions">
        <button class="app-button" type="button" (click)="signOut()" [disabled]="isSigningOut">
          {{ isSigningOut ? 'Signing Out...' : 'Sign Out' }}
        </button>
      </div>
    </section>

    @if (showMainBoard()) {
    <section class="settings-section">
      <p class="settings-section-title">Main Board</p>

      <label class="settings-field">
        <span class="settings-label-inline">Main board for /{{ vm.username }}</span>
        <div class="settings-input-status-row">
          <select [ngModel]="vm.mainBoardId" (ngModelChange)="onMainBoardChanged($event)">
            <option value="">No public main board</option>
            @for (board of vm.boards; track board.id) {
              <option [value]="board.id" [disabled]="board.visibility === 'private'">
                {{ board.boardName }}{{ board.visibility === 'private' ? ' · Private' : '' }} ({{ boardRoute(board) }})
              </option>
            }
          </select>
          @if (vm.saved) {
            <em class="settings-saved-indicator">Saved</em>
          }
        </div>
      </label>

    </section>
    }
    @if (vm.errorMessage) {
      <p role="alert" class="settings-status settings-status--error">{{ vm.errorMessage }}</p>
    }
    } @else {
      @if (vm.isHydrating) {
        <p>Loading account…</p>
      } @else {
        <a routerLink="/signin">Sign in to manage your account</a>
      }
    }
  }
</article>
