<article class="widget">
  <h3>{{ widget.title }}</h3>

  <ng-container *ngIf="vm$ | async as vm">
    <ng-container *ngIf="vm.profile; else signedOut">
    <section class="settings-section">
      <p class="settings-section-title">Account Information</p>

      <label class="settings-field">
        <span>Name</span>
        <div class="settings-input-status-row">
          <input
            type="text"
            [ngModel]="vm.displayName"
            (ngModelChange)="onProfileFieldChanged('displayName', $event)"
            placeholder="Enter your name"
          />
          <em class="settings-saved-indicator" *ngIf="vm.profileSavedField === 'displayName'">Saved</em>
        </div>
      </label>

      <label class="settings-field">
        <span>Username</span>
        <div class="settings-input-status-row">
          <input
            type="text"
            [ngModel]="vm.username"
            (ngModelChange)="onProfileFieldChanged('username', $event)"
            placeholder="Enter your username"
          />
          <em class="settings-saved-indicator" *ngIf="vm.profileSavedField === 'username'">Saved</em>
        </div>
      </label>

      <label class="settings-field">
        <span>Email</span>
        <div class="settings-input-status-row">
          <input
            type="email"
            [ngModel]="vm.email"
            (ngModelChange)="onProfileFieldChanged('email', $event)"
            placeholder="Enter your email"
          />
          <em class="settings-saved-indicator" *ngIf="vm.profileSavedField === 'email'">Saved</em>
        </div>
      </label>

      <label class="settings-field">
        <span>Password</span>
        <input type="password" placeholder="Enter your password" />
      </label>

      <div class="settings-actions">
        <button type="button" (click)="signOut()" [disabled]="isSigningOut">
          {{ isSigningOut ? 'Signing Out...' : 'Sign Out' }}
        </button>
        <button type="button">Delete Account</button>
      </div>
    </section>

    <section class="settings-section">
      <p class="settings-section-title">Main Board</p>

      <label class="settings-field">
        <span class="settings-label-inline">Main board for /{{ vm.username }}</span>
        <div class="settings-input-status-row">
          <select [ngModel]="vm.mainBoardId" (ngModelChange)="onMainBoardChanged($event)">
            <option value="" selected disabled>Select a board</option>
            <option *ngFor="let board of vm.boards" [value]="board.id">
              {{ board.boardName }} ({{ boardRoute(board) }})
            </option>
          </select>
          <em class="settings-saved-indicator" *ngIf="vm.saved">Saved</em>
        </div>
      </label>

      <p role="alert" class="settings-status settings-status--error" *ngIf="vm.errorMessage">{{ vm.errorMessage }}</p>
    </section>
    </ng-container>
    <ng-template #signedOut>
      <p *ngIf="vm.isHydrating; else signinPrompt">Loading account…</p>
      <ng-template #signinPrompt><a routerLink="/signin">Sign in to manage your account</a></ng-template>
    </ng-template>
  </ng-container>
</article>
