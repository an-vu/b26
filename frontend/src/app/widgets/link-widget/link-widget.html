<article class="widget">
  <h3>{{ widget.title }}</h3>
  <img *ngIf="imageUrl" [src]="imageUrl" [alt]="widget.title" loading="lazy" />
  <p *ngIf="description" class="description">{{ description }}</p>
  <a *ngIf="url; else invalid" class="link app-button" (click)="recordClick()" [href]="url" target="_blank" rel="noreferrer noopener">
    Visit
  </a>
  <ng-template #invalid>
    <p class="fallback">Link URL is missing or invalid.</p>
  </ng-template>
</article>
