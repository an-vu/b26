<div class="widget-settings-panel">
  <p class="widget-description" *ngIf="draft.type === 'link'">Give people a place to connect with you on social media.</p>
  <label *ngIf="draft.type === 'link'">
    <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Social media link</span><input class="app-textbox" type="url" [disabled]="disabled" name="widget-url" aria-label="Social media link" placeholder="Social media link" [(ngModel)]="draft.linkUrl" (ngModelChange)="fieldChange.emit()" /></span>
  </label>
  <label *ngIf="draft.type === 'embed'">
    <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">URL</span><input class="app-textbox" type="url" [disabled]="disabled" name="widget-embed-url" aria-label="URL" placeholder="URL" [(ngModel)]="draft.embedUrl" (ngModelChange)="fieldChange.emit()" /></span>
  </label>
  <label *ngIf="draft.type === 'map'">
    <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Places (one per line)</span><textarea class="app-textbox" [disabled]="disabled" name="widget-places" aria-label="Places (one per line)" placeholder="Places (one per line)" [(ngModel)]="draft.placesText" (ngModelChange)="fieldChange.emit()" rows="4"></textarea></span>
  </label>
  <p class="field-error" *ngIf="error">{{ error }}</p>
</div>
