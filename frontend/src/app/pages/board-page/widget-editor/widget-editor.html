@let current = draft();
<div class="widget-settings-panel">
  @switch (current.type) {
    @case ('link') {
      <p class="widget-description">Give people a place to connect with you on social media.</p>
      <label>
        <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Social media link</span><input class="app-textbox" type="url" [disabled]="disabled()" name="widget-url" aria-label="Social media link" placeholder="Social media link" [ngModel]="current.linkUrl" (ngModelChange)="draftChange.emit({ linkUrl: $event })" /></span>
      </label>
    }
    @case ('embed') {
      <label>
        <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">URL</span><input class="app-textbox" type="url" [disabled]="disabled()" name="widget-embed-url" aria-label="URL" placeholder="URL" [ngModel]="current.embedUrl" (ngModelChange)="draftChange.emit({ embedUrl: $event })" /></span>
      </label>
    }
    @case ('map') {
      <label>
        <span class="app-text-field"><span class="app-text-field-label" aria-hidden="true">Places (one per line)</span><textarea class="app-textbox" [disabled]="disabled()" name="widget-places" aria-label="Places (one per line)" placeholder="Places (one per line)" [ngModel]="current.placesText" (ngModelChange)="draftChange.emit({ placesText: $event })" rows="4"></textarea></span>
      </label>
    }
  }
  @if (error(); as message) {
    <p class="field-error">{{ message }}</p>
  }
</div>
