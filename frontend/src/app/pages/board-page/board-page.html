<div class="board-feedback" *ngIf="boardDeleteError || isDeletingBoard || (boardNotice$ | async)">
  <p class="error" role="alert" *ngIf="boardDeleteError">{{ boardDeleteError }}</p>
  <p role="status" *ngIf="isDeletingBoard">Deleting board…</p>
  <p role="status" *ngIf="boardNotice$ | async as notice">
    {{ notice }} <button class="app-button" type="button" (click)="dismissBoardNotice()">Dismiss</button>
  </p>
</div>
<ng-container *ngIf="pageState$ | async as state">
  <main
    class="page page-fixed-scroll"
    *ngIf="state.status === 'ready'"
    [attr.data-pattern]="boardPatternDraft"
    [attr.data-intensity]="boardPatternIntensityDraft"
    [attr.data-theme]="siteTheme.themeId()"
    [attr.data-color-mode]="siteTheme.colorMode()"
    [style.--board-widget-radius.px]="boardRadiusDraft"
    [style.--widget-spacing.px]="boardSpacingStepDraft * 8"
    [style.--board-bg-color]="siteTheme.background()"
    [style.--board-night-bg]="siteTheme.nightBackground()"
    [style.--board-foreground]="siteTheme.foreground()"
    [style.--wallpaper-tint]="siteTheme.background() === '#f9f8f6' ? 'transparent' : siteTheme.background()"
    [style.--board-accent]="siteTheme.background() === '#f9f8f6' ? '#00b2d7' : siteTheme.background()"
    [style.--board-muted]="siteTheme.background() === '#f9f8f6' ? '#62625e' : siteTheme.foreground()"
  >
    <app-board-atmosphere [appearance]="appearanceDraft" [darkInk]="boardTheme.id === 'default' && !boardThemeToggleDraft && boardDisplayText === '#30302e'" />
    <div class="board-shell">
      <app-board-profile
        [board]="state.board"
        [isWidgetEditMode]="isWidgetEditMode"
        [(profileNameDraft)]="profileNameDraft"
        [(boardDraftHeadline)]="boardDraftHeadline"
        [(boardDraftWebsite)]="boardDraftWebsite"
        [isWidgetSaving]="isWidgetSaving"
        [readOnlyView]="readOnlyView"
        [canEditBoard]="canEditBoard"
        [isSettingsReloading]="isSettingsReloading"
        [isWidgetLoading]="isWidgetLoading"
        [isIdentitySaving]="isIdentitySaving"
        [settingsFeedback]="settingsFeedback"
        (edit)="requestWidgetEdit(state.board)" (save)="doneWidgetEdit()" (cancel)="discardWidgetEdit()">
        <app-widget-library animate.leave="panel-slide-down" *ngIf="isWidgetEditMode" [disabled]="isWidgetSaving || isIdentitySaving" (selectWidget)="addWidgetFromLibrary($event)" />
      </app-board-profile>

      <section appWidgetBounce class="board-content widgets-section" *ngIf="widgets$ | async as widgets">
        <p class="error" role="alert" *ngIf="widgetSaveError">{{ widgetSaveError }}</p>

        <div class="board-grid square-grid" *ngIf="isWidgetEditMode">
          <article
            *ngFor="let draft of widgetDrafts; let i = index"
            [class]="'board-tile widget-tile widget-edit-tile ' + tileLayoutClass(draft.layout)"
            [class.board-card]="isWidgetSettingsOpen(draft)"
            [class.widget-settings-open]="isWidgetSettingsOpen(draft)"
            (click)="openWidgetSettings(draft)"
          >
            <button
              type="button"
              class="app-button widget-delete-button"
              [attr.aria-label]="'Delete widget: ' + (draft.title || 'Untitled')" title="Delete widget"
              (click)="deleteWidget(draft); $event.stopPropagation()"
              [disabled]="isWidgetSaving"
            >
              <app-icon name="minus" />
            </button>

            <ng-container *ngIf="isWidgetSettingsOpen(draft); else widgetPreview">
              <app-widget-editor [draft]="draft" [i]="i" [total]="widgetDrafts.length" [disabled]="isWidgetSaving || isIdentitySaving" [saving]="isWidgetSaving" [error]="getDraftValidationError(draft)"
                (fieldChange)="onWidgetDraftFieldChange(draft)" (typeChange)="onWidgetTypeChange(draft)" (move)="moveWidget(draft, $event)" />
            </ng-container>

            <ng-template #widgetPreview>
              <div class="widget-edit-preview">
                <app-widget-host [widget]="widgetPreviewFromDraft(draft, i)"></app-widget-host>
              </div>
            </ng-template>
          </article>


        </div>

        <ng-container *ngIf="!isWidgetEditMode">
          <p class="widgets-empty text-muted" *ngIf="widgets.length === 0">No widgets configured yet.</p>
          <div class="board-grid square-grid" *ngIf="widgets.length > 0">
            <div
              class="board-tile widget-tile"
              *ngFor="let widget of widgets; let i = index; trackBy: trackWidget"
              [class]="'board-tile widget-tile ' + tileLayoutClass(widget.layout)"
            >
              <app-widget-host [widget]="widget" [boardId]="state.board.id"></app-widget-host>
            </div>
          </div>
        </ng-container>
      </section>
    </div>

    <app-site-navigation [beforeSignOut]="prepareSignOut">
      <app-board-settings *ngIf="!readOnlyView && canEditBoard"
        [board]="state.board"
        [menuLabel]="boardMenuLabel(state.board.id)"
        [(boardIdentityNameDraft)]="boardIdentityNameDraft"
        [(boardIdentitySlugDraft)]="boardIdentitySlugDraft"
        [appearanceDraft]="appearanceDraft"
        [accountBoards]="accountBoards"
        [accountMainBoardId]="accountMainBoardId"
        [pendingDeleteBoardUrl]="pendingDeleteBoardUrl"
        [pendingDeleteBoardLabel]="pendingDeleteBoardLabel"
        [accountActionError]="accountActionError"
        [boardDeleteError]="boardDeleteError"
        [deletingBoardUrl]="deletingBoardUrl"
        [identitySaveError]="identitySaveError"
        [isSettingsReloading]="isSettingsReloading"
        [isBoardIdentityMenuOpen]="isBoardIdentityMenuOpen"
        [isWidgetEditMode]="isWidgetEditMode"
        [isWidgetLoading]="isWidgetLoading"
        [isWidgetSaving]="isWidgetSaving"
        [isIdentitySaving]="isIdentitySaving"
        [isBoardSwitcherOpen]="isBoardSwitcherOpen"
        [isSettingMainBoard]="isSettingMainBoard"
        [hasUnsavedChanges]="hasUnsavedChanges"
        [isDeletingBoard]="isDeletingBoard"
        (toggle)="toggleBoardIdentityMenu()" (save)="saveSettingsAutomatically()" (reset)="resetAppearance()"
        (appearancePreview)="applyAppearance($event)" (appearanceChange)="onAppearanceChange($event)" (switchBoard)="switchToBoard($event)"
        (deleteBoard)="onAccountBoardDelete(state.board.boardUrl, $event)" (setMain)="onAccountBoardSetMain($event.id, $event.event)"
        (toggleSwitcher)="toggleBoardSwitcher()" (confirmDelete)="confirmBoardDelete()" (dismiss)="dismissBoardSettings($event)" />
    </app-site-navigation>
  </main>
  <main class="page board-status" [attr.data-theme]="siteTheme.themeId()" [attr.data-color-mode]="siteTheme.colorMode()" data-pattern="none" *ngIf="state.status === 'loading'">
    <p>Loading...</p>
  </main>
  <main class="page board-status" [attr.data-theme]="siteTheme.themeId()" [attr.data-color-mode]="siteTheme.colorMode()" data-pattern="none" *ngIf="state.status === 'missing'">
    <p>Board not found.</p>
  </main>

  <app-site-navigation *ngIf="state.status !== 'ready'" />
</ng-container>
