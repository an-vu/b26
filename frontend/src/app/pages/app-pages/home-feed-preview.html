<div class="feed-grid-container">
<section class="feed-grid" aria-label="Community activity">
  <article class="feed-tile feed-post" tabindex="0" role="group"
    [attr.aria-label]="post.board.ownerDisplayName + ' · @' + post.board.ownerUsername + ' · ' + post.minutesAgo + ' minutes ago'"
    *ngFor="let post of posts" [style.--feed-columns]="columns(post.widgets[0].layout)" [style.--feed-rows]="rows(post.widgets[0].layout)">
    <div class="feed-reveal widget">
      <div class="activity-line">
        <a class="activity-author" [routerLink]="boardRoute(post.board)">
          <img class="avatar" [src]="post.avatarUrl || '/brand/avatar-placeholder.svg'" [alt]="post.board.ownerDisplayName + ' profile'" />
          <span class="activity-identity"><strong>{{ post.board.ownerDisplayName }}</strong><span>@{{ post.board.ownerUsername }}</span></span>
        </a>
        <span class="activity-time">{{ post.minutesAgo }}m</span>
      </div>
      <app-widget-host [widget]="post.widgets[0]" [previewMode]="true" />
      <div class="activity-footer" aria-label="Preview reactions">
        <button type="button" disabled aria-label="Like, preview only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button>
        <button type="button" disabled aria-label="Comments, preview only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3v-6a3 3 0 0 1-1-2V6a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3Z"/></svg></button>
      </div>
    </div>
  </article>
  <article class="feed-tile suggestion-tile" *ngFor="let person of suggestions">
    <div class="suggestion widget">
    <p class="suggestion-label">Suggested for you</p>
    <span class="suggestion-avatar" aria-hidden="true">{{ (person.board.ownerDisplayName || '?').slice(0, 1) }}</span>
    <strong>{{ person.board.ownerDisplayName }}</strong><span class="suggestion-handle">@{{ person.board.ownerUsername }}</span>
    <a class="app-button" [routerLink]="boardRoute(person.board)">Visit board <span aria-hidden="true">↗</span></a>
    </div>
  </article>
</section>
</div>
