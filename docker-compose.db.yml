# Optional local-only database. Keep deployed database configuration separate.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: b26
      POSTGRES_USER: b26
      POSTGRES_PASSWORD: b26-local-only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - b26-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b26 -d b26']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  b26-local-postgres:
